[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peru-audit-intelligence"
version = "0.1.0"
description = "Búsqueda trazable en informes públicos de control del Perú"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "pgvector>=0.3,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "pypdf>=6,<7", "httpx>=0.28,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.45,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
audit = "peru_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to disposable PostgreSQL + pgvector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
