name: audit-intelligence

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: audit_intelligence
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./docker/postgres/init/01-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    mem_limit: 512m
    shm_size: 128mb
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  init:
    build: .
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-audit}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}@postgres:5432/audit_intelligence
      OLLAMA_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      GENERATION_ENABLED: ${GENERATION_ENABLED:-false}
      LLM_MODEL: ${LLM_MODEL:-}
      MIN_SEMANTIC_SCORE: ${MIN_SEMANTIC_SCORE:-0.6}
    command: ["audit", "init-db"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: .
    environment: *backend_environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - raw_data:/app/data/raw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
  frontend:
    build: .
    environment:
      API_URL: http://backend:8000
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0",
              "--browser.gatherUsageStats=false"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - backend
volumes:
  postgres18_data:
  raw_data:
